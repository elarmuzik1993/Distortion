<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sledge Launch Post</title>
<!--
  Launch ad creative for Sledge Distortion.
  Render: node marketing/launch/render.js  (feed 1080x1350, story 1080x1920)
  Fonts: Orbitron from Resources/, Inter Display / Inter installed locally.
-->
<style>
  @font-face { font-family: "Orbitron"; font-weight: 700;
               src: url("../../Resources/Orbitron-Bold.ttf"); }
  :root {
    --red: #ff0044;
    --red-soft: #ff6f8f;
    --ink: #f4f4f6;
    --muted: #b9b9c2;
    --bg: #0b0b0e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); overflow: hidden; }
  body.story { height: 1920px; }
  .canvas {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-bottom: 10px;
    background:
      radial-gradient(ellipse 70% 38% at 50% 64%, rgba(255,0,68,.30), transparent 70%),
      radial-gradient(ellipse 90% 55% at 50% 0%, rgba(255,0,68,.10), transparent 70%),
      linear-gradient(180deg, #120709 0%, #0b0b0e 45%, #08080a 100%);
    font-family: "Inter", sans-serif; color: var(--ink); text-align: center;
  }
  body.story .canvas { padding: 250px 0 340px; } /* clear the Stories UI */

  .logo { width: 400px; display: block; box-shadow: 0 0 40px rgba(255,0,68,.35); }
  .kicker {
    margin-top: 44px; font-family: "Orbitron"; font-weight: 700;
    font-size: 25px; letter-spacing: .42em; color: var(--red-soft);
    padding-left: .42em;
  }
  h1 {
    margin-top: 22px; font-family: "Inter Display", "Inter", sans-serif; font-weight: 900;
    font-size: 104px; line-height: .94; letter-spacing: -.01em; text-transform: uppercase;
  }
  h1 .hot { color: var(--red); text-shadow: 0 0 34px rgba(255,0,68,.55); }
  .sub { margin-top: 26px; font-size: 31px; font-weight: 500; color: var(--muted); }
  .sub b { color: var(--ink); font-weight: 600; }

  .stage {
    position: relative; margin-top: 44px; width: 940px; height: 520px;
    perspective: 1600px;
  }
  body.story .stage { margin-top: 90px; height: 560px; }
  /* The window is a slab: a screen face plus stacked layers behind it that
     read as a thick body once rotated. */
  .floor {
    position: absolute; left: 50%; bottom: -34px; width: 880px; height: 90px;
    transform: translateX(-50%) rotate(2deg); border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.95), rgba(255,0,68,.18) 55%, transparent 72%);
    filter: blur(18px);
  }
  /* A rack-style hardware unit: brushed-metal chassis with rack ears and
     screws, the plugin set into a recessed screen, and a printed label strip.
     Screen: 804 x 472 (the screenshot's 1200:705). Chassis adds 58 px a side
     (44 px ear + 14 px bezel), 18 px on top and a 34 px label strip below. */
  .device {
    position: absolute; left: 50%; top: 50%; width: 920px; height: 524px;
    transform: translate(-50%, -50%) rotateX(16deg) rotateY(-12deg) rotateZ(3deg);
    transform-style: preserve-3d;
  }
  /* Each layer's colour is set in the script below: a bright machined lip at
     the front fading to near black at the back, so the side reads as metal. */
  .slab { position: absolute; inset: 0; border-radius: 8px; }
  .slab.back { box-shadow: 0 40px 90px rgba(0,0,0,.85), 0 0 110px rgba(255,0,68,.28); }
  .chassis {
    position: absolute; inset: 0; border-radius: 8px; transform: translateZ(.5px);
    background:
      linear-gradient(118deg, rgba(255,255,255,.10) 0%, transparent 35%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, #3a3a42 0%, #26262c 38%, #1a1a1f 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(0,0,0,.7), 0 0 0 1px #000;
  }
  .ear {
    position: absolute; top: 0; bottom: 0; width: 44px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px),
      linear-gradient(90deg, #303037, #1f1f24);
  }
  .ear.l { left: 0; border-radius: 8px 0 0 8px; box-shadow: inset -1px 0 0 #000, 1px 0 0 rgba(255,255,255,.07); }
  .ear.r { right: 0; border-radius: 0 8px 8px 0; box-shadow: inset 1px 0 0 #000, -1px 0 0 rgba(255,255,255,.07); }
  .hole {                   /* oval rack-mount slot with a screw in it */
    position: absolute; left: 50%; width: 20px; height: 34px; transform: translateX(-50%);
    border-radius: 10px; background: #060608;
    box-shadow: inset 0 3px 4px rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.10);
    display: flex; align-items: center; justify-content: center;
  }
  .hole.t { top: 30px; } .hole.b { bottom: 30px; }
  .screw {
    position: relative; width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e4e4ea 0%, #8a8a93 40%, #3a3a40 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.9);
  }
  .screw::before, .screw::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 2px;
    background: #1c1c20; transform: translate(-50%, -50%) rotate(35deg);
  }
  .screw::after { transform: translate(-50%, -50%) rotate(125deg); }
  .screen {
    position: absolute; left: 58px; right: 58px; top: 18px; height: 472px;
    border-radius: 3px; overflow: hidden;
    box-shadow:
      0 0 0 2px #050507,                        /* gasket */
      0 0 0 3px rgba(255,255,255,.10),          /* machined edge of the cut-out */
      0 -3px 6px 2px rgba(0,0,0,.6),            /* recess shadow under the top bezel */
      inset 0 0 24px rgba(0,0,0,.55);
  }
  .strip {
    position: absolute; left: 58px; right: 58px; bottom: 0; height: 34px;
    display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 0;
    font-family: "Orbitron"; font-weight: 700; font-size: 12px; letter-spacing: .32em;
    color: rgba(235,235,242,.62); text-shadow: 0 1px 0 rgba(0,0,0,.9);
  }
  .strip .brand { color: rgba(255,0,68,.85); }
  .strip .power { display: flex; align-items: center; gap: 10px; }
  .led {
    width: 9px; height: 9px; border-radius: 50%; background: #ff2a5c;
    box-shadow: 0 0 6px 2px rgba(255,0,68,.8), 0 0 16px 4px rgba(255,0,68,.35);
  }
  .screen img { display: block; width: 100%; height: 100%; }
  .screen::after {          /* glass sheen across the face */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(118deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.04) 28%,
                transparent 42%, transparent 78%, rgba(255,0,68,.08) 100%);
  }
  .badge {
    position: absolute; right: -36px; top: 78px; width: 136px; height: 136px; z-index: 2;
    border-radius: 50%; background: var(--red); color: #0b0b0e;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Orbitron"; font-weight: 700; transform: rotate(12deg);
    box-shadow: 0 0 40px rgba(255,0,68,.6), 0 10px 30px rgba(0,0,0,.6);
  }
  .badge .big { font-size: 36px; letter-spacing: .04em; }
  .badge .small { font-size: 14px; letter-spacing: .18em; margin-top: 4px; }

  .cta {
    margin-top: 50px; padding: 30px 78px; border-radius: 999px; background: var(--red);
    color: #0b0b0e; font-family: "Orbitron"; font-weight: 700; font-size: 34px;
    letter-spacing: .3em; padding-right: calc(78px - .3em);
    box-shadow: 0 0 50px rgba(255,0,68,.55);
  }
  body.story .cta { margin-top: 90px; }
  .url { margin-top: 22px; font-size: 24px; font-weight: 500; color: var(--muted); letter-spacing: .08em; }
</style>
</head>
<body>
  <div class="canvas">
    <img class="logo" src="assets/logo.png" alt="Monolit Beatz">
    <div class="kicker" id="kicker">DESTROY YOUR 808s &amp; BASS</div>
    <h1 id="headline"><span id="l1">Hit it with</span><br><span class="hot" id="l2">the Sledge.</span></h1>
    <p class="sub"><b>Sledge Distortion</b> · VST3 / AU · Win · Mac · Linux</p>

    <div class="stage">
      <div class="floor"></div>
      <div class="device" id="device">
        <div class="chassis">
          <div class="ear l"><div class="hole t"><div class="screw"></div></div><div class="hole b"><div class="screw"></div></div></div>
          <div class="ear r"><div class="hole t"><div class="screw"></div></div><div class="hole b"><div class="screw"></div></div></div>
          <div class="screen"><img src="assets/ui.png" alt="Sledge Distortion interface"></div>
          <div class="strip">
            <span>SLEDGE DISTORTION</span>
            <span class="brand">MONOLIT BEATZ</span>
            <span class="power"><span class="led"></span>POWER</span>
          </div>
        </div>
      </div>
      <div class="badge"><span class="big">FREE</span><span class="small">PLUGIN</span></div>
    </div>

    <div class="cta">DOWNLOAD FREE</div>
    <div class="url">monolitbeatz.com</div>
  </div>
  <script>
    if (location.hash === "#story") document.body.classList.add("story");
    // Headline variants: post.html?k=KICKER&l1=LINE1&l2=LINE2 (used by variants.js).
    const q = new URLSearchParams(location.search);
    for (const id of ["kicker", "l1", "l2"]) {
      const key = id === "kicker" ? "k" : id;
      if (q.has(key)) document.getElementById(id).textContent = q.get(key);
    }
    // Shrink the headline until its longest line fits the canvas.
    const h = document.getElementById("headline");
    let size = 104;
    while (size > 60 && Math.max(...[...h.querySelectorAll("span")].map(e => e.offsetWidth)) > 960) {
      h.style.fontSize = (size -= 2) + "px";
    }
    // Build the slab's thickness: 1 px layers stepping back DEPTH px, shaded
    // from a machined lip through a gunmetal body to near black at the back.
    const device = document.getElementById("device");
    const DEPTH = 58, STEP = 1, LIP = 3;
    const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
    const LIP_RGB = [150, 150, 160], FRONT = [66, 60, 68], BACK = [16, 15, 18];
    for (let z = STEP; z <= DEPTH; z += STEP) {
      const s = document.createElement("div");
      s.className = "slab" + (z + STEP > DEPTH ? " back" : "");
      s.style.transform = `translateZ(${-z}px)`;
      const t = Math.pow((z - LIP) / (DEPTH - LIP), 0.7);
      const rgb = z <= LIP ? mix(LIP_RGB, FRONT, (z - STEP) / LIP) : mix(FRONT, BACK, t);
      s.style.background = `rgb(${rgb.join(",")})`;
      device.insertBefore(s, device.firstChild);
    }
  </script>
</body>
</html>
