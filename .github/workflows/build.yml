name: Build VST3 Plugin

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

# Only one run per branch/PR at a time; pushing again cancels the superseded run
# instead of paying it out to completion. Never cancels tag runs — those publish
# the release and must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  PLUGIN_NAME: "Sledge Distortion"

jobs:
  build-windows:
    runs-on: windows-latest

    # Azure Trusted Signing creds (set as repo secrets to activate signing).
    # When unset these are empty strings and the signing steps below skip, so
    # the pipeline still builds an (unsigned) installer.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
      TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
      TS_PROFILE: ${{ secrets.AZURE_TS_CERT_PROFILE }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        submodules: recursive

    # Non-tag builds are dev builds. Take the version from CMakeLists.txt rather
    # than repeating a literal here, so a release bump happens in exactly one
    # place and the packaged filenames can never drift from the built binary.
    - name: Resolve dev version
      shell: bash
      run: |
        VER=$(sed -n 's/^project(Distortion VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
        if [ -z "$VER" ]; then
          echo "could not parse project version from CMakeLists.txt" >&2
          exit 1
        fi
        echo "DEV_VERSION=$VER" >> "$GITHUB_ENV"
        echo "dev version: $VER"

    - name: Setup Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
      with:
        python-version: '3.11'

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build Plugin
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target Distortion_VST3 -j

    - name: Fix moduleinfo.json
      run: |
        python scripts/fix_moduleinfo_json.py build/Distortion_artefacts --all
      continue-on-error: true

    - name: Build Tests
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target DistortionTests -j

    - name: Run Tests
      run: |
        build/DistortionTests_artefacts/${{ env.BUILD_TYPE }}/DistortionTests.exe

    - name: Validate with pluginval (strictness 10)
      shell: bash
      run: |
        curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
        unzip -q -o pluginval.zip
        ./pluginval.exe --strictness-level 10 --timeout-ms 600000 --validate "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Sledge Distortion.vst3"

    - name: Sign VST3 (Azure Trusted Signing)
      if: env.AZURE_CLIENT_ID != ''
      uses: azure/trusted-signing-action@bb15ca63eb5548cc306f4f335c5617bb414abcad # v0.5.9
      with:
        azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
        azure-client-id: ${{ env.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
        endpoint: ${{ env.TS_ENDPOINT }}
        trusted-signing-account-name: ${{ env.TS_ACCOUNT }}
        certificate-profile-name: ${{ env.TS_PROFILE }}
        files-folder: build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Sledge Distortion.vst3/Contents/x86_64-win
        files-folder-filter: vst3
        files-folder-recurse: true

    - name: Download VC++ redistributable for bundling
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force installer\redist | Out-Null
        curl.exe -fsSL -o installer\redist\vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
        $sig = Get-AuthenticodeSignature installer\redist\vc_redist.x64.exe
        if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
          throw "vc_redist.x64.exe failed signature verification: status=$($sig.Status) signer=$($sig.SignerCertificate.Subject)"
        }

    - name: Build installer (Inno Setup)
      shell: pwsh
      run: |
        choco install innosetup --no-progress -y
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        # See the bash jobs: keyed off ref TYPE, so a branch named v* is not
        # mistaken for a tag.
        $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { $env:DEV_VERSION }
        & $iscc "/DMyAppVersion=$ver" installer\Distortion.iss

    - name: Sign installer (Azure Trusted Signing)
      if: env.AZURE_CLIENT_ID != ''
      uses: azure/trusted-signing-action@bb15ca63eb5548cc306f4f335c5617bb414abcad # v0.5.9
      with:
        azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
        azure-client-id: ${{ env.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
        endpoint: ${{ env.TS_ENDPOINT }}
        trusted-signing-account-name: ${{ env.TS_ACCOUNT }}
        certificate-profile-name: ${{ env.TS_PROFILE }}
        files-folder: dist
        files-folder-filter: exe
        files-folder-recurse: false

    - name: Upload Windows installer
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SledgeDistortion-Installer-Windows
        path: dist/*.exe
        retention-days: 30

    - name: Prepare Windows Artifact
      shell: bash
      run: |
        mkdir -p artifact/Windows
        echo "=== Distortion_artefacts contents ==="
        find build/Distortion_artefacts -type d | head -30
        cp -r "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Sledge Distortion.vst3" artifact/Windows/

    - name: Upload Windows VST3
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SledgeDistortion-VST3-Windows
        path: artifact/Windows/Sledge Distortion.vst3
        retention-days: 30

    # Friction-free download: unzip and drop the .vst3 into the VST3 folder.
    # Copying a bundle does not trip SmartScreen the way running the unsigned
    # .exe installer does, so this is the low-friction route while the build is
    # unsigned (USE-49).
    #
    # The redistributable ships INSIDE the zip on purpose. The plugin links the
    # dynamic CRT, so on a clean Windows 10 machine it will not load without the
    # VC++ 2015-2022 runtime - that is the failure this project already tracked
    # down once. The installer handles it automatically; a bare .vst3 zip cannot,
    # so the runtime travels with it and README.txt says when to run it. Shipping
    # the zip without it would reintroduce the exact bug the installer fixed.
    #
    # LICENSE and THIRD-PARTY-NOTICES.md travel too. The GPL requires the terms
    # to accompany every copy (the installer satisfies this via LicenseFile), and
    # the notices carry the Orbitron OFL text and the Steinberg VST3 BSD notice,
    # both of which oblige us to reproduce them in binary distributions.
    - name: Package Windows ZIP
      shell: pwsh
      run: |
        # See the bash jobs: keyed off ref TYPE, so a branch named v* is not
        # mistaken for a tag.
        $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { $env:DEV_VERSION }
        $stage = "zipstage"
        New-Item -ItemType Directory -Force $stage | Out-Null
        Copy-Item -Recurse "artifact\Windows\Sledge Distortion.vst3" $stage
        Copy-Item "installer\redist\vc_redist.x64.exe" $stage
        Copy-Item "LICENSE" "$stage\LICENSE.txt"
        Copy-Item "THIRD-PARTY-NOTICES.md" "$stage\THIRD-PARTY-NOTICES.md"
        @"
        Sledge Distortion $ver - Windows (VST3)

        1. Copy "Sledge Distortion.vst3" into your VST3 folder:
             C:\Program Files\Common Files\VST3
           Windows asks for administrator permission for that folder. To install
           without it, use your user folder instead and add it to your DAW's
           plugin search paths:
             %LOCALAPPDATA%\Programs\Common\VST3

        2. If the plugin does not appear, or your DAW reports it failed to load,
           run vc_redist.x64.exe (included) and rescan. This installs the
           Microsoft VC++ 2015-2022 runtime, which the plugin needs and which a
           clean Windows 10 machine often lacks. It is harmless to run if the
           runtime is already present.

        3. Rescan plugins in your DAW.

        This build is not code-signed, so Windows may warn about an unknown
        publisher. Verify your download against SHA256SUMS on the release page.

        Sledge Distortion is free software under the GNU GPL v3 - see LICENSE.txt.
        Third-party terms (JUCE, VST3 SDK, Orbitron font): THIRD-PARTY-NOTICES.md
        Source code: https://github.com/elarmuzik1993/Distortion
        "@ | Set-Content -Encoding ascii "$stage\README.txt"   # ascii: no BOM, and the text above is ASCII by design
        # 7z rather than Compress-Archive, to keep the archive spec-conformant
        # regardless of which PowerShell runs it. Windows PowerShell 5.1 (and
        # .NET Framework's ZipFile) store backslash path separators, so a
        # spec-following extractor sees one flat entry named
        # "Sledge Distortion.vst3\Contents\..." instead of a loadable bundle.
        # pwsh 7 fixes that, and this step is `shell: pwsh` - but 7z removes the
        # dependency on that detail entirely, and is what ships on the runners.
        7z a -tzip "SledgeDistortion-$ver-Windows.zip" ".\$stage\*" | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
        # The notices obligation is enforced here rather than by a human reading
        # a checklist: if a packaging change ever drops these, the build fails.
        $listing = (& 7z l "SledgeDistortion-$ver-Windows.zip" | Out-String) -replace '\\','/'
        foreach ($f in @(
            'LICENSE.txt',
            'THIRD-PARTY-NOTICES.md',
            'Sledge Distortion.vst3/Contents/Resources/LICENSE',
            'Sledge Distortion.vst3/Contents/Resources/THIRD-PARTY-NOTICES.md')) {
          if ($listing -notmatch [regex]::Escape($f)) {
            throw "missing from Windows ZIP: $f"
          }
        }
        Get-ChildItem "SledgeDistortion-$ver-Windows.zip" | ForEach-Object { "packaged $($_.Name) ($([math]::Round($_.Length/1MB,1))MB)" }

    - name: Upload Windows ZIP
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SledgeDistortion-Windows-zip
        path: SledgeDistortion-*-Windows.zip
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Non-tag builds are dev builds. Take the version from CMakeLists.txt rather
    # than repeating a literal here, so a release bump happens in exactly one
    # place and the packaged filenames can never drift from the built binary.
    - name: Resolve dev version
      shell: bash
      run: |
        VER=$(sed -n 's/^project(Distortion VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
        if [ -z "$VER" ]; then
          echo "could not parse project version from CMakeLists.txt" >&2
          exit 1
        fi
        echo "DEV_VERSION=$VER" >> "$GITHUB_ENV"
        echo "dev version: $VER"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          xvfb \
          libasound2-dev \
          libcurl4-openssl-dev \
          libjack-jackd2-dev \
          ladspa-sdk \
          libfreetype6-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libwebkit2gtk-4.1-dev \
          libglu1-mesa-dev \
          mesa-common-dev

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build Plugin
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target Distortion_VST3 -j$(nproc)

    - name: Fix moduleinfo.json
      run: |
        python scripts/fix_moduleinfo_json.py build/Distortion_artefacts --all
      continue-on-error: true

    - name: Build Tests
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target DistortionTests -j$(nproc)

    - name: Run Tests
      run: |
        ./build/DistortionTests_artefacts/${{ env.BUILD_TYPE }}/DistortionTests

    - name: Validate with pluginval (strictness 10)
      run: |
        curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
        unzip -q -o pluginval.zip
        chmod +x pluginval
        xvfb-run -a ./pluginval --strictness-level 10 --timeout-ms 600000 --validate "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Sledge Distortion.vst3"

    - name: Prepare Linux Artifact
      run: |
        mkdir -p artifact/Linux
        cp -r "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Sledge Distortion.vst3" artifact/Linux/

    - name: Upload Linux VST3
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SledgeDistortion-VST3-Linux
        path: artifact/Linux/Sledge Distortion.vst3
        retention-days: 30

    - name: Package Linux tarball
      run: |
        # Version-stamped like every other release asset; SHA256SUMS in the
        # release job replaces the per-file .sha256 sidecar.
        # Tag builds carry the real version; everything else is a dev build.
        # Keyed off GITHUB_REF_TYPE, not a "v*" name match: a branch that merely
        # starts with v (verify-thing) would otherwise be read as tag "erify-thing".
        if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"; else VER="$DEV_VERSION"; fi
        # The bundle already carries LICENSE + THIRD-PARTY-NOTICES.md inside
        # Contents/Resources (see CMakeLists.txt), so the terms survive being
        # copied into a VST3 folder. These top-level copies are for
        # discoverability, so nobody has to open a bundle to read them.
        #
        # Everything is staged under ONE versioned directory: a tarball with
        # three top-level entries scatters loose licence files into whatever
        # directory the user happens to extract from, and can clobber a
        # same-named file from another project.
        root="SledgeDistortion-$VER-Linux"
        mkdir -p "artifact/Linux/$root"
        cp -R "artifact/Linux/Sledge Distortion.vst3" "artifact/Linux/$root/"
        cp LICENSE "artifact/Linux/$root/LICENSE.txt"
        cp THIRD-PARTY-NOTICES.md "artifact/Linux/$root/THIRD-PARTY-NOTICES.md"
        tar -C artifact/Linux -czf "SledgeDistortion-$VER-Linux.tar.gz" "$root"
        # Enforced in CI, not on a checklist - see the Windows ZIP step.
        tar tzf "SledgeDistortion-$VER-Linux.tar.gz" > tarlist.txt
        for f in "$root/LICENSE.txt" \
                 "$root/THIRD-PARTY-NOTICES.md" \
                 "$root/Sledge Distortion.vst3/Contents/Resources/LICENSE" \
                 "$root/Sledge Distortion.vst3/Contents/Resources/THIRD-PARTY-NOTICES.md"; do
          grep -qF -- "$f" tarlist.txt || { echo "::error::missing from Linux tarball: $f"; exit 1; }
        done

    - name: Upload Linux tarball
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SledgeDistortion-Linux-tarball
        path: SledgeDistortion-*-Linux.tar.gz
        retention-days: 30

  build-macos:
    # GitHub bills macOS runners at 10x minutes (Linux 1x, Windows 2x), so this
    # job is the most expensive thing in the workflow by a wide margin. It runs
    # only where it is load-bearing: release tags, and on-demand via the Actions
    # UI. The release job below needs it, and tags satisfy this condition, so
    # publishing still gets a validated macOS build.
    #
    # Trade-off: macOS regressions surface at tag time rather than on the PR.
    # Run the workflow manually before tagging if a change touches the macOS
    # path (CMakeLists, installer/macos/, or anything platform-conditional).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14

    # Apple Developer ID signing + notarization creds (set as repo secrets to
    # activate). When unset these are empty strings and every sign/notarize step
    # below skips, so the pipeline still builds an (unsigned) universal .pkg.
    env:
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Non-tag builds are dev builds. Take the version from CMakeLists.txt rather
    # than repeating a literal here, so a release bump happens in exactly one
    # place and the packaged filenames can never drift from the built binary.
    - name: Resolve dev version
      shell: bash
      run: |
        VER=$(sed -n 's/^project(Distortion VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
        if [ -z "$VER" ]; then
          echo "could not parse project version from CMakeLists.txt" >&2
          exit 1
        fi
        echo "DEV_VERSION=$VER" >> "$GITHUB_ENV"
        echo "dev version: $VER"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure CMake (universal arm64 + x86_64)
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

    - name: Build Plugin (VST3 + AU + Standalone)
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} \
          --target Distortion_VST3 Distortion_AU Distortion_Standalone -j3

    - name: Fix moduleinfo.json
      run: |
        python scripts/fix_moduleinfo_json.py build/Distortion_artefacts --all
      continue-on-error: true

    - name: Build Tests
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target DistortionTests -j3

    - name: Run Tests
      run: |
        ./build/DistortionTests_artefacts/${{ env.BUILD_TYPE }}/DistortionTests

    - name: Verify universal binaries
      run: |
        BASE="build/Distortion_artefacts/${{ env.BUILD_TYPE }}"
        for slice in \
          "VST3/Sledge Distortion.vst3/Contents/MacOS/Sledge Distortion" \
          "AU/Sledge Distortion.component/Contents/MacOS/Sledge Distortion"; do
          echo "== $slice =="
          lipo -archs "$BASE/$slice"
          lipo -archs "$BASE/$slice" | grep -q "arm64" && lipo -archs "$BASE/$slice" | grep -q "x86_64" \
            || { echo "ERROR: $slice is not universal (arm64 + x86_64)"; exit 1; }
        done

    - name: Validate with pluginval (strictness 10)
      run: |
        curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
        unzip -q -o pluginval.zip
        PV="pluginval.app/Contents/MacOS/pluginval"
        "$PV" --strictness-level 10 --timeout-ms 600000 --validate "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Sledge Distortion.vst3"

    - name: Validate AU (auval)
      run: |
        mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
        cp -R "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/AU/Sledge Distortion.component" "$HOME/Library/Audio/Plug-Ins/Components/"
        killall -9 AudioComponentRegistrar || true
        auval -v aufx Dist Mbds

    - name: Import signing certificate
      if: env.APPLE_CERT_BASE64 != ''
      run: |
        KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
        security create-keychain -p actions "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p actions "$KEYCHAIN"
        echo "$APPLE_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
        security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"

    - name: Codesign plugins (Developer ID + hardened runtime)
      if: env.APPLE_CERT_BASE64 != '' && env.APPLE_SIGN_IDENTITY != ''
      run: |
        BASE="build/Distortion_artefacts/${{ env.BUILD_TYPE }}"
        for b in \
          "VST3/Sledge Distortion.vst3" \
          "AU/Sledge Distortion.component" \
          "Standalone/Sledge Distortion.app"; do
          codesign --force --deep --options runtime --timestamp \
            --entitlements installer/macos/entitlements.plist \
            --sign "$APPLE_SIGN_IDENTITY" "$BASE/$b"
          codesign --verify --strict --verbose=2 "$BASE/$b"
        done

    - name: Build installer (.pkg)
      run: |
        BASE="build/Distortion_artefacts/${{ env.BUILD_TYPE }}"
        # Tag builds carry the real version; everything else is a dev build.
        # Keyed off GITHUB_REF_TYPE, not a "v*" name match: a branch that merely
        # starts with v (verify-thing) would otherwise be read as tag "erify-thing".
        if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"; else VER="$DEV_VERSION"; fi
        installer/macos/build_pkg.sh "$VER" \
          "$BASE/VST3/Sledge Distortion.vst3" \
          "$BASE/AU/Sledge Distortion.component" \
          "$BASE/Standalone/Sledge Distortion.app" \
          dist

    - name: Verify licence files are in the .pkg payload
      run: |
        # The licence and Read Me panes are transient installer UI - they leave
        # nothing on disk. What makes the .pkg compliant is the copy embedded in
        # each bundle, so that is what gets checked.
        PKG=$(ls dist/*.pkg | head -n1)
        # --expand-full unpacks the payloads too, so this is a plain find over
        # the real installed tree rather than a hand-rolled cpio pipeline.
        rm -rf pkgcheck
        pkgutil --expand-full "$PKG" pkgcheck
        # Guard the guard: an empty expansion must not read as "nothing missing".
        find pkgcheck -name "Sledge Distortion.vst3" -maxdepth 6 | grep -q . \
          || { echo "::error::pkg expansion produced no VST3 bundle - check failed to run"; exit 1; }
        for f in LICENSE THIRD-PARTY-NOTICES.md; do
          find pkgcheck -path "*/Contents/Resources/$f" | grep -q . \
            || { echo "::error::missing from .pkg payload: Contents/Resources/$f"; exit 1; }
        done
        echo "pkg payload carries LICENSE + THIRD-PARTY-NOTICES.md"

    - name: Notarize + staple installer
      if: env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != ''
      run: |
        PKG=$(ls dist/*.pkg | head -n1)
        xcrun notarytool submit "$PKG" \
          --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
          --wait
        xcrun stapler staple "$PKG"

    - name: Upload macOS installer
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SledgeDistortion-Installer-macOS
        path: dist/*.pkg
        retention-days: 30

    - name: Package macOS bundles (zip + checksum)
      run: |
        BASE="build/Distortion_artefacts/${{ env.BUILD_TYPE }}"
        mkdir -p artifact/macOS
        cp -R "$BASE/VST3/Sledge Distortion.vst3" artifact/macOS/
        cp -R "$BASE/AU/Sledge Distortion.component" artifact/macOS/
        # Version-stamped to match the .pkg and the Windows zip, so a release
        # page carrying several versions stays unambiguous. The per-file .sha256
        # is gone; SHA256SUMS in the release job is the single list.
        # Tag builds carry the real version; everything else is a dev build.
        # Keyed off GITHUB_REF_TYPE, not a "v*" name match: a branch that merely
        # starts with v (verify-thing) would otherwise be read as tag "erify-thing".
        if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"; else VER="$DEV_VERSION"; fi
        # Single versioned root and top-level licence copies - see the Linux
        # job for why. --keepParent is what puts the root directory inside the
        # archive; without it ditto stores the directory's contents.
        root="SledgeDistortion-$VER-macOS"
        mkdir -p "artifact/macOS/$root"
        mv "artifact/macOS/Sledge Distortion.vst3" \
           "artifact/macOS/Sledge Distortion.component" "artifact/macOS/$root/"
        cp LICENSE "artifact/macOS/$root/LICENSE.txt"
        cp THIRD-PARTY-NOTICES.md "artifact/macOS/$root/THIRD-PARTY-NOTICES.md"
        ditto -c -k --keepParent "artifact/macOS/$root" "SledgeDistortion-$VER-macOS.zip"
        # Enforced in CI, not on a checklist - see the Windows ZIP step.
        unzip -Z1 "SledgeDistortion-$VER-macOS.zip" > ziplist.txt
        for f in "$root/LICENSE.txt" \
                 "$root/THIRD-PARTY-NOTICES.md" \
                 "$root/Sledge Distortion.vst3/Contents/Resources/THIRD-PARTY-NOTICES.md" \
                 "$root/Sledge Distortion.component/Contents/Resources/THIRD-PARTY-NOTICES.md"; do
          grep -qF -- "$f" ziplist.txt || { echo "::error::missing from macOS ZIP: $f"; exit 1; }
        done

    - name: Upload macOS bundles zip
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SledgeDistortion-macOS-zip
        path: SledgeDistortion-*-macOS.zip
        retention-days: 30

  # Create release when a tag is pushed
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    # Required to publish the release. The repository's default workflow
    # permission is read-only, so without this GITHUB_TOKEN cannot create a
    # release and the step fails with a bare 403 - which is what happened on the
    # first v2.3.0 tag: all three platforms built, then the release step 403'd
    # three times and aborted. Scoped to this job; every other job only reads.
    permissions:
      contents: write

    steps:
    - name: Download Windows installer
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        name: SledgeDistortion-Installer-Windows
        path: release

    - name: Download Windows ZIP
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        name: SledgeDistortion-Windows-zip
        path: release

    - name: Download Linux tarball
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        name: SledgeDistortion-Linux-tarball
        path: release

    - name: Download macOS installer
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        name: SledgeDistortion-Installer-macOS
        path: release

    # The macOS zip was already being built and uploaded by build-macos, but
    # nothing ever downloaded it here, so it expired with the run instead of
    # reaching the release page. Adding *.zip below without this would publish
    # the Windows zip only and leave macOS users on the highest-friction path.
    - name: Download macOS ZIP
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        name: SledgeDistortion-macOS-zip
        path: release

    - name: Generate combined checksums
      run: |
        cd release
        # One list for every asset. The build jobs no longer emit per-file
        # .sha256 sidecars, and INSTALL.md points users at this file.
        sha256sum *.exe *.zip *.tar.gz *.pkg > SHA256SUMS
        cat SHA256SUMS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974 # v2.1.0
      with:
        files: |
          release/*.exe
          release/*.zip
          release/*.tar.gz
          release/*.pkg
          release/SHA256SUMS
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
