name: Build VST3 Plugin

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

env:
  BUILD_TYPE: Release
  PLUGIN_NAME: Distortion

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build Plugin
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target Distortion -j

    - name: Fix moduleinfo.json
      run: |
        python scripts/fix_moduleinfo_json.py build/Distortion_artefacts --all
      continue-on-error: true

    - name: Build Tests
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target DistortionTests -j

    - name: Run Tests
      run: |
        build/DistortionTests_artefacts/${{ env.BUILD_TYPE }}/DistortionTests.exe
      continue-on-error: true

    - name: Prepare Windows Artifact
      shell: bash
      run: |
        mkdir -p artifact/Windows
        # MSVC multi-config puts output under a config subfolder
        if [ -d "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3" ]; then
          cp -r build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Distortion.vst3 artifact/Windows/
        elif [ -d "build/Distortion_artefacts/VST3" ]; then
          cp -r build/Distortion_artefacts/VST3/Distortion.vst3 artifact/Windows/
        else
          echo "Searching for VST3 output..."
          find build/Distortion_artefacts -name "Distortion.vst3" -type d
          cp -r $(find build/Distortion_artefacts -name "Distortion.vst3" -type d | head -1) artifact/Windows/
        fi

    - name: Upload Windows VST3
      uses: actions/upload-artifact@v4
      with:
        name: Distortion-VST3-Windows
        path: artifact/Windows/Distortion.vst3
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libasound2-dev \
          libjack-jackd2-dev \
          ladspa-sdk \
          libfreetype6-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libwebkit2gtk-4.1-dev \
          libglu1-mesa-dev \
          mesa-common-dev

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build Plugin
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target Distortion -j$(nproc)

    - name: Fix moduleinfo.json
      run: |
        python scripts/fix_moduleinfo_json.py build/Distortion_artefacts --all
      continue-on-error: true

    - name: Build Tests
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target DistortionTests -j$(nproc)

    - name: Run Tests
      run: |
        ./build/DistortionTests_artefacts/${{ env.BUILD_TYPE }}/DistortionTests
      continue-on-error: true

    - name: Prepare Linux Artifact
      run: |
        mkdir -p artifact/Linux
        cp -r build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Distortion.vst3 artifact/Linux/

    - name: Upload Linux VST3
      uses: actions/upload-artifact@v4
      with:
        name: Distortion-VST3-Linux
        path: artifact/Linux/Distortion.vst3
        retention-days: 30

  # Create release when a tag is pushed
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: Distortion-VST3-Windows
        path: windows

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: Distortion-VST3-Linux
        path: linux

    - name: Create ZIP archives
      run: |
        cd windows && zip -r ../Distortion-VST3-Windows.zip Distortion.vst3
        cd ../linux && zip -r ../Distortion-VST3-Linux.zip Distortion.vst3

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Distortion-VST3-Windows.zip
          Distortion-VST3-Linux.zip
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
