name: Build VST3 Plugin

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

# Only one run per branch/PR at a time; pushing again cancels the superseded run
# instead of paying it out to completion. Never cancels tag runs — those publish
# the release and must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  BUILD_TYPE: Release
  PLUGIN_NAME: "Sledge Distortion"

jobs:
  build-windows:
    runs-on: windows-latest

    # Azure Trusted Signing creds (set as repo secrets to activate signing).
    # When unset these are empty strings and the signing steps below skip, so
    # the pipeline still builds an (unsigned) installer.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
      TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
      TS_PROFILE: ${{ secrets.AZURE_TS_CERT_PROFILE }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build Plugin
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target Distortion_VST3 -j

    - name: Fix moduleinfo.json
      run: |
        python scripts/fix_moduleinfo_json.py build/Distortion_artefacts --all
      continue-on-error: true

    - name: Build Tests
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target DistortionTests -j

    - name: Run Tests
      run: |
        build/DistortionTests_artefacts/${{ env.BUILD_TYPE }}/DistortionTests.exe

    - name: Validate with pluginval (strictness 10)
      shell: bash
      run: |
        curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
        unzip -q -o pluginval.zip
        ./pluginval.exe --strictness-level 10 --timeout-ms 600000 --validate "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Sledge Distortion.vst3"

    - name: Sign VST3 (Azure Trusted Signing)
      if: env.AZURE_CLIENT_ID != ''
      uses: azure/trusted-signing-action@v0.5.9
      with:
        azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
        azure-client-id: ${{ env.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
        endpoint: ${{ env.TS_ENDPOINT }}
        trusted-signing-account-name: ${{ env.TS_ACCOUNT }}
        certificate-profile-name: ${{ env.TS_PROFILE }}
        files-folder: build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Sledge Distortion.vst3/Contents/x86_64-win
        files-folder-filter: vst3
        files-folder-recurse: true

    - name: Download VC++ redistributable for bundling
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force installer\redist | Out-Null
        curl.exe -fsSL -o installer\redist\vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
        $sig = Get-AuthenticodeSignature installer\redist\vc_redist.x64.exe
        if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
          throw "vc_redist.x64.exe failed signature verification: status=$($sig.Status) signer=$($sig.SignerCertificate.Subject)"
        }

    - name: Build installer (Inno Setup)
      shell: pwsh
      run: |
        choco install innosetup --no-progress -y
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        $ver = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '2.2.0' }
        & $iscc "/DMyAppVersion=$ver" installer\Distortion.iss

    - name: Sign installer (Azure Trusted Signing)
      if: env.AZURE_CLIENT_ID != ''
      uses: azure/trusted-signing-action@v0.5.9
      with:
        azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
        azure-client-id: ${{ env.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
        endpoint: ${{ env.TS_ENDPOINT }}
        trusted-signing-account-name: ${{ env.TS_ACCOUNT }}
        certificate-profile-name: ${{ env.TS_PROFILE }}
        files-folder: dist
        files-folder-filter: exe
        files-folder-recurse: false

    - name: Upload Windows installer
      uses: actions/upload-artifact@v4
      with:
        name: SledgeDistortion-Installer-Windows
        path: dist/*.exe
        retention-days: 30

    - name: Prepare Windows Artifact
      shell: bash
      run: |
        mkdir -p artifact/Windows
        echo "=== Distortion_artefacts contents ==="
        find build/Distortion_artefacts -type d | head -30
        cp -r "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Sledge Distortion.vst3" artifact/Windows/

    - name: Upload Windows VST3
      uses: actions/upload-artifact@v4
      with:
        name: SledgeDistortion-VST3-Windows
        path: artifact/Windows/Sledge Distortion.vst3
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          xvfb \
          libasound2-dev \
          libcurl4-openssl-dev \
          libjack-jackd2-dev \
          ladspa-sdk \
          libfreetype6-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libwebkit2gtk-4.1-dev \
          libglu1-mesa-dev \
          mesa-common-dev

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build Plugin
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target Distortion_VST3 -j$(nproc)

    - name: Fix moduleinfo.json
      run: |
        python scripts/fix_moduleinfo_json.py build/Distortion_artefacts --all
      continue-on-error: true

    - name: Build Tests
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target DistortionTests -j$(nproc)

    - name: Run Tests
      run: |
        ./build/DistortionTests_artefacts/${{ env.BUILD_TYPE }}/DistortionTests

    - name: Validate with pluginval (strictness 10)
      run: |
        curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
        unzip -q -o pluginval.zip
        chmod +x pluginval
        xvfb-run -a ./pluginval --strictness-level 10 --timeout-ms 600000 --validate "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Sledge Distortion.vst3"

    - name: Prepare Linux Artifact
      run: |
        mkdir -p artifact/Linux
        cp -r "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Sledge Distortion.vst3" artifact/Linux/

    - name: Upload Linux VST3
      uses: actions/upload-artifact@v4
      with:
        name: SledgeDistortion-VST3-Linux
        path: artifact/Linux/Sledge Distortion.vst3
        retention-days: 30

    - name: Package Linux tarball + checksum
      run: |
        tar -C artifact/Linux -czf "SledgeDistortion-Linux.tar.gz" "Sledge Distortion.vst3"
        sha256sum "SledgeDistortion-Linux.tar.gz" > "SledgeDistortion-Linux.tar.gz.sha256"

    - name: Upload Linux tarball
      uses: actions/upload-artifact@v4
      with:
        name: SledgeDistortion-Linux-tarball
        path: |
          SledgeDistortion-Linux.tar.gz
          SledgeDistortion-Linux.tar.gz.sha256
        retention-days: 30

  build-macos:
    # GitHub bills macOS runners at 10x minutes (Linux 1x, Windows 2x), so this
    # job is the most expensive thing in the workflow by a wide margin. It runs
    # only where it is load-bearing: release tags, and on-demand via the Actions
    # UI. The release job below needs it, and tags satisfy this condition, so
    # publishing still gets a validated macOS build.
    #
    # Trade-off: macOS regressions surface at tag time rather than on the PR.
    # Run the workflow manually before tagging if a change touches the macOS
    # path (CMakeLists, installer/macos/, or anything platform-conditional).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14

    # Apple Developer ID signing + notarization creds (set as repo secrets to
    # activate). When unset these are empty strings and every sign/notarize step
    # below skips, so the pipeline still builds an (unsigned) universal .pkg.
    env:
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure CMake (universal arm64 + x86_64)
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

    - name: Build Plugin (VST3 + AU + Standalone)
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} \
          --target Distortion_VST3 Distortion_AU Distortion_Standalone -j3

    - name: Fix moduleinfo.json
      run: |
        python scripts/fix_moduleinfo_json.py build/Distortion_artefacts --all
      continue-on-error: true

    - name: Build Tests
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --target DistortionTests -j3

    - name: Run Tests
      run: |
        ./build/DistortionTests_artefacts/${{ env.BUILD_TYPE }}/DistortionTests

    - name: Verify universal binaries
      run: |
        BASE="build/Distortion_artefacts/${{ env.BUILD_TYPE }}"
        for slice in \
          "VST3/Sledge Distortion.vst3/Contents/MacOS/Sledge Distortion" \
          "AU/Sledge Distortion.component/Contents/MacOS/Sledge Distortion"; do
          echo "== $slice =="
          lipo -archs "$BASE/$slice"
          lipo -archs "$BASE/$slice" | grep -q "arm64" && lipo -archs "$BASE/$slice" | grep -q "x86_64" \
            || { echo "ERROR: $slice is not universal (arm64 + x86_64)"; exit 1; }
        done

    - name: Validate with pluginval (strictness 10)
      run: |
        curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
        unzip -q -o pluginval.zip
        PV="pluginval.app/Contents/MacOS/pluginval"
        "$PV" --strictness-level 10 --timeout-ms 600000 --validate "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/VST3/Sledge Distortion.vst3"

    - name: Validate AU (auval)
      run: |
        mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
        cp -R "build/Distortion_artefacts/${{ env.BUILD_TYPE }}/AU/Sledge Distortion.component" "$HOME/Library/Audio/Plug-Ins/Components/"
        killall -9 AudioComponentRegistrar || true
        auval -v aufx Dist Mbds
      continue-on-error: true

    - name: Import signing certificate
      if: env.APPLE_CERT_BASE64 != ''
      run: |
        KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
        security create-keychain -p actions "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p actions "$KEYCHAIN"
        echo "$APPLE_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
        security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"

    - name: Codesign plugins (Developer ID + hardened runtime)
      if: env.APPLE_CERT_BASE64 != '' && env.APPLE_SIGN_IDENTITY != ''
      run: |
        BASE="build/Distortion_artefacts/${{ env.BUILD_TYPE }}"
        for b in \
          "VST3/Sledge Distortion.vst3" \
          "AU/Sledge Distortion.component" \
          "Standalone/Sledge Distortion.app"; do
          codesign --force --deep --options runtime --timestamp \
            --entitlements installer/macos/entitlements.plist \
            --sign "$APPLE_SIGN_IDENTITY" "$BASE/$b"
          codesign --verify --strict --verbose=2 "$BASE/$b"
        done

    - name: Build installer (.pkg)
      run: |
        BASE="build/Distortion_artefacts/${{ env.BUILD_TYPE }}"
        VER="${GITHUB_REF_NAME#v}"
        case "$GITHUB_REF_NAME" in v*) : ;; *) VER=2.2.0 ;; esac
        installer/macos/build_pkg.sh "$VER" \
          "$BASE/VST3/Sledge Distortion.vst3" \
          "$BASE/AU/Sledge Distortion.component" \
          "$BASE/Standalone/Sledge Distortion.app" \
          dist

    - name: Notarize + staple installer
      if: env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != ''
      run: |
        PKG=$(ls dist/*.pkg | head -n1)
        xcrun notarytool submit "$PKG" \
          --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
          --wait
        xcrun stapler staple "$PKG"

    - name: Upload macOS installer
      uses: actions/upload-artifact@v4
      with:
        name: SledgeDistortion-Installer-macOS
        path: dist/*.pkg
        retention-days: 30

    - name: Package macOS bundles (zip + checksum)
      run: |
        BASE="build/Distortion_artefacts/${{ env.BUILD_TYPE }}"
        mkdir -p artifact/macOS
        cp -R "$BASE/VST3/Sledge Distortion.vst3" artifact/macOS/
        cp -R "$BASE/AU/Sledge Distortion.component" artifact/macOS/
        ditto -c -k artifact/macOS "SledgeDistortion-macOS.zip"
        shasum -a 256 "SledgeDistortion-macOS.zip" > "SledgeDistortion-macOS.zip.sha256"

    - name: Upload macOS bundles zip
      uses: actions/upload-artifact@v4
      with:
        name: SledgeDistortion-macOS-zip
        path: |
          SledgeDistortion-macOS.zip
          SledgeDistortion-macOS.zip.sha256
        retention-days: 30

  # Create release when a tag is pushed
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download Windows installer
      uses: actions/download-artifact@v4
      with:
        name: SledgeDistortion-Installer-Windows
        path: release

    - name: Download Linux tarball
      uses: actions/download-artifact@v4
      with:
        name: SledgeDistortion-Linux-tarball
        path: release

    - name: Download macOS installer
      uses: actions/download-artifact@v4
      with:
        name: SledgeDistortion-Installer-macOS
        path: release

    - name: Generate combined checksums
      run: |
        cd release
        sha256sum *.exe *.tar.gz *.pkg > SHA256SUMS
        cat SHA256SUMS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/*.exe
          release/*.tar.gz
          release/*.pkg
          release/SHA256SUMS
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
